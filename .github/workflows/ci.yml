name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: NapariCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: NapariCore
        run: swift test

  app-build:
    name: Build iPad app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Napari.xcodeproj \
            -scheme Napari \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
