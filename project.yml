# Generate Napari.xcodeproj with `xcodegen generate` (brew install xcodegen).
name: Napari
options:
  bundleIdPrefix: org.napari
  deploymentTarget:
    iOS: "17.0"
packages:
  NapariCore:
    path: NapariCore
targets:
  Napari:
    type: application
    platform: iOS
    sources:
      - NapariApp/Sources
    dependencies:
      - package: NapariCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.napari.ios
        PRODUCT_NAME: napari
        TARGETED_DEVICE_FAMILY: "2" # iPad
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: napari
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES # trackpad scroll and hover
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
schemes:
  Napari:
    build:
      targets:
        Napari: all
